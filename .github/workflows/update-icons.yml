name: Nightly Icon Update

on:
  schedule:
    - cron: '0 2 * * *'  # 2 AM UTC every day (10 PM AEDT or 11 PM AEST)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-icons:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download and update icons
      run: bash update-icons.sh
      
    - name: Check for changes
      id: verify-changes
      run: |
        if git diff --quiet; then
          echo "has_changes=false" >> $GITHUB_OUTPUT
        else
          echo "has_changes=true" >> $GITHUB_OUTPUT
          git diff --stat
        fi
      
    - name: Create Pull Request
      if: steps.verify-changes.outputs.has_changes == 'true'
      uses: peter-evans/create-pull-request@v5
      with:
        commit-message: 'chore: update cloud icons'
        title: 'chore: nightly icon update'
        body: 'Automated nightly update of cloud service icons from official sources.'
        branch: update-icons-${{ github.run_number }}
        delete-branch: true
