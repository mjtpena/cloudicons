name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Publish
        run: dotnet publish -c Release -o ./dist

      - name: Copy content from subfolder to root
        run: |
          cp -r ./dist/wwwroot/cloudicons/* ./dist/wwwroot/
          rm -rf ./dist/wwwroot/cloudicons

      - name: Add .nojekyll file
        run: touch ./dist/wwwroot/.nojekyll

      - name: Fix icon paths in JSON files
        run: |
          find ./dist/wwwroot/data -name "*.json" -exec sed -i 's|"/icons/|"icons/|g' {} \;

      - name: Add .nojekyll file
        run: touch ./dist/wwwroot/.nojekyll

      - name: Add 404.html for client-side routing
        run: |
          cp ./dist/wwwroot/index.html ./dist/wwwroot/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/wwwroot

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
